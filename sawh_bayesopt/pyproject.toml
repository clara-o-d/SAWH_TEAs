[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sawh-bayesopt"
version = "0.1.0"
description = "Global two-stage SAWH optimization: hydrogel thickness by constrained Bayesian optimization, daily operation by enumeration, both on a learned physics surrogate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Clara" }]

dependencies = [
    "solar-lumped-sawh",
    "scikit-learn>=1.3",
    "threadpoolctl>=3.1",
    "scipy>=1.11",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    # Global maps (plots.py).
    "cartopy>=0.22",
    "requests-cache>=1.2",
    # Physics runs through solar_lumped.jax_daily_cycle (JAX/diffrax); on a GPU node install
    # "jax[cuda12]" instead before installing this package, or reinstall it afterward.
    "jax",
    "diffrax",
    # The MLP surrogate and the inner-loop predictor (surrogates.py, optimize.py).
    "equinox",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
